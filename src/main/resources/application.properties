# ===== Địa chỉ LẤY HÀNG (kho/cửa hàng của bạn) - lấy districtId/wardCode qua
# GET /api/shipping/wards?provinceId=... trong Postman rồi tìm phường/xã kho bạn ở =====
ghn.shop.from-district-id=1450
ghn.shop.from-ward-code=20806

# Mã tỉnh/thành TP.HCM theo GHN (dùng để quyết định: TPHCM -> shipper nội bộ + ưu đãi;
# ngoài TPHCM -> GHN, không áp ưu đãi). 202 là ID chuẩn GHN trả cho "Hồ Chí Minh".
ghn.tphcm-province-id=202

# Khối lượng/kích thước mặc định dùng để TÍNH PHÍ SHIP (khách chưa đặt hàng nên chưa biết
# khối lượng thật) — có thể chỉnh lại cho sát với phụ tùng xe máy trung bình.
ghn.default-item-weight-gram=500
ghn.default-box-length-cm=20
ghn.default-box-width-cm=15
ghn.default-box-height-cm=10