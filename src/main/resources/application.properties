spring.application.name=PS45101_NguyenHoangThienHau_ASM
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=MotunPoLy;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=226868

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

spring.thymeleaf.cache=false
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=30MB

# Tomcat mặc định chỉ cho phép request/multipart tối đa 2MB (max-swallow-size),
# phải nâng lên khớp với multipart ở trên, nếu không sẽ bị lỗi
# "Failed to parse multipart servlet request" khi upload ảnh > 2MB
server.tomcat.max-swallow-size=30MB
server.tomcat.max-http-form-post-size=30MB

# Tomcat 10.1.42+/11.0.8+ (dùng trong Spring Boot 4.x) mặc định giới hạn tối đa 10 "part"
# trong 1 request multipart (mỗi field text + mỗi file đều tính là 1 part).
# Form sản phẩm có nhiều field + nhiều ảnh gallery nên rất dễ vượt quá 10 -> nâng lên 50.
server.tomcat.max-part-count=50

# Thư mục lưu ảnh upload (nằm ngoài thư mục build/source, không cần restart server)
app.upload.dir=uploads/imges

